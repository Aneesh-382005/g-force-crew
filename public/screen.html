<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>G-Force Crew</title>
<style>
  :root { --bg: #0b1220; --fg: #f2f6ff; --accent: #ffb020; --ok: #46e08a; --panel: rgba(8, 14, 28, .78); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font: 20px/1.35 system-ui, sans-serif; }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 2px 8px #000a; }
  #flash { inset: 0; }
  #score { top: 18px; left: 28px; font-size: 52px; font-weight: 800; }
  #hull { top: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .pip { width: 28px; height: 14px; border-radius: 4px; background: var(--ok); }
  .pip.off { background: #ffffff30; }
  #room { top: 16px; right: 28px; text-align: right; font-size: 16px; }
  #room b { display: block; font-size: 44px; letter-spacing: .12em; color: var(--accent); line-height: 1; }
  #panel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #card { background: var(--panel); border-radius: 24px; padding: 28px 40px; text-align: center; max-width: 900px; backdrop-filter: blur(6px); }
  #card h1 { margin: 0 0 6px; font-size: 54px; letter-spacing: .04em; }
  #card img { width: 240px; height: 240px; image-rendering: pixelated; border-radius: 12px; background: #fff; padding: 8px; }
  #crews { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; max-height: 210px; overflow: hidden; }
  .crew { background: #ffffff18; border-radius: 10px; padding: 4px 14px; font-size: 22px; }
  .off { opacity: .45; }
  button { font: inherit; font-weight: 700; padding: 14px 34px; border: 0; border-radius: 14px; background: var(--accent); color: #111; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #tools { bottom: 14px; left: 20px; font-size: 14px; opacity: .7; }
  #banner { top: 96px; left: 50%; transform: translateX(-50%); font-size: 46px; font-weight: 800; letter-spacing: .06em; white-space: nowrap; opacity: 0; transition: opacity .4s; }
  #more { font-size: 15px; opacity: .65; margin-top: 10px; }
</style>

<div id="flash" class="hud"></div>
<div id="score" class="hud"></div>
<div id="hull" class="hud"></div>
<div id="room" class="hud"></div>
<div id="banner" class="hud"></div>
<div id="panel"><div id="card"></div></div>
<div id="tools" class="hud">Enter start · M sound · N skip time · C calm mode</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const lerp = (a, b, u) => a + (b - a) * u;
const COLORS = [0xff6b6b, 0x4dd0e1, 0xffd93d, 0xb388ff, 0x69f0ae, 0xff9ff3, 0xffa94d, 0x74c0fc];
const HULL_MAX = 8, CYCLE_S = 120, DELAY = 90;
const hex = (c) => "#" + c.toString(16).padStart(6, "0");
const store = (k, v) => { try { return v == null ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch {} };

/* ---------- scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color();
scene.fog = new THREE.Fog(0x7cc7f5, 90, 270);
const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 1200);
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(-20, 40, 30);
scene.add(sunLight);
let camZ = 24;
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  camZ = Math.max(24, 29 / (Math.tan(Math.PI / 6) * camera.aspect));       // keep the full flight width (+-24) on screen at any aspect ratio
});
dispatchEvent(new Event("resize"));

const checker = document.createElement("canvas"); checker.width = checker.height = 128;
{ const c = checker.getContext("2d"); c.fillStyle = "#4f9d52"; c.fillRect(0, 0, 128, 128); c.fillStyle = "#58ab5a"; c.fillRect(0, 0, 64, 64); c.fillRect(64, 64, 64, 64); }
const groundTex = new THREE.CanvasTexture(checker);
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(40, 80);
const groundMat = new THREE.MeshLambertMaterial({ map: groundTex });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 800), groundMat);
ground.rotation.x = -Math.PI / 2; ground.position.set(0, 0, -300);
scene.add(ground);

function disc(inner, outer) {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d"), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, inner); grad.addColorStop(0.35, inner); grad.addColorStop(0.4, outer); grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, fog: false, depthWrite: false }));
  s.scale.set(90, 90, 1);
  return s;
}
const sun = disc("#fffbe0", "rgba(255,210,120,.35)"), moon = disc("#eef2ff", "rgba(190,205,255,.25)");
scene.add(sun, moon);

const starPos = new Float32Array(1200);
for (let i = 0; i < 400; i++) {
  const az = Math.random() * Math.PI * 2, el = Math.asin(0.05 + Math.random() * 0.95), r = 450;
  starPos.set([r * Math.cos(el) * Math.sin(az), r * Math.sin(el), -r * Math.cos(el) * Math.cos(az)], i * 3);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false }));
scene.add(stars);

// [time of day 0..1, sky, ground tint, light]; the sun peaks at 0.25 and sets at 0.5. Pale haze and twilight keys keep orange -> blue from going gray.
const KEYS = [
  [0.00, 0xf0a070, 0xc8b090, 0.8], [0.08, 0xcfe2f0, 0xe8e0d0, 0.95], [0.18, 0x7cc7f5, 0xffffff, 1.1], [0.34, 0x7cc7f5, 0xffffff, 1.1],
  [0.44, 0xf2c28f, 0xe8c8a0, 0.9], [0.50, 0xe0703c, 0xd09070, 0.75], [0.57, 0x4a3566, 0x6a5a7a, 0.55], [0.66, 0x070b1c, 0x30406a, 0.4],
  [0.92, 0x070b1c, 0x30406a, 0.4], [0.97, 0x4a3a60, 0x6a5a80, 0.55], [1.00, 0xf0a070, 0xc8b090, 0.8],
].map(([t, sky, ground, light]) => ({ t, sky: new THREE.Color(sky), ground: new THREE.Color(ground), light }));
let clock = 8;

/* ---------- entities ---------- */
const planes = new Map(), enemies = new Map(), bullets = new Map(), beams = new Map(), sparks = [];
const enemyGeo = new THREE.IcosahedronGeometry(1.5, 0);
const enemyMat = new THREE.MeshPhongMaterial({ color: 0xff4d4d, emissive: 0x551111, flatShading: true, shininess: 20 });
const bulletGeo = new THREE.BoxGeometry(0.28, 0.28, 2.6), bulletMat = new THREE.MeshBasicMaterial({ color: 0x7df9ff });
const sparkGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
const beamGeo = new THREE.BoxGeometry(1, 0.12, 0.12), beamMat = new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.85 });

function burst(x, y, z, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color, transparent: true }));
    m.position.set(x, y, z); scene.add(m);
    sparks.push({ m, v: new THREE.Vector3((Math.random() - 0.5) * 22, (Math.random() - 0.3) * 22, (Math.random() - 0.5) * 22), life: 0.7 });
  }
}

// one mesh per id: create new, move existing, drop the ones that vanished
function syncMeshes(map, list, make, place) {
  const seen = new Set();
  for (const row of list) {
    seen.add(row[0]);
    let m = map.get(row[0]);
    if (!m) { m = make(row); scene.add(m); map.set(row[0], m); }
    place(m, row);
  }
  for (const [id, m] of map) if (!seen.has(id)) { scene.remove(m); map.delete(id); }
}

/* ---------- state from the server ---------- */
const watch = (new URLSearchParams(location.search).get("watch") || "").toUpperCase();       // ?watch=CODE: an extra screen for the same game
let ws, code = watch || sessionStorage.getItem("gfc.code") || "", baseUrl = location.origin, calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let bannerTimer;
let state = "lobby", roster = [], score = 0, hull = HULL_MAX, best = +store("gfc.best") || 0, shake = 0, flash = 0;
const buf = [];                                              // recent snapshots; drawn DELAY ms in the past so motion is smooth

function drawCard() {
  $("panel").style.display = state === "play" ? "none" : "flex";
  if (state === "play") return;
  const crews = new Map();
  for (const p of roster) (crews.get(p.crew) ?? crews.set(p.crew, []).get(p.crew)).push(p);
  const list = [...crews].map(([id, ps]) => `<div class="crew" style="border-left:6px solid ${hex(COLORS[(id - 1) % COLORS.length])}">` +
    ps.map((p) => `<span class="${p.on ? "" : "off"}">${p.name}</span>`).join(" + ") + "</div>").join("");
  const players = roster.filter((p) => p.on).length;
  if (state === "over") {
    const rank = [...(buf.at(-1)?.s.sh ?? [])].sort((a, b) => b[9] - a[9]).map((r, i) =>
      `<div class="crew" style="border-left:6px solid ${hex(COLORS[(r[1] - 1) % COLORS.length])}">${i === 0 && r[9] ? "★ " : ""}${roster.find((p) => p.id === r[0])?.name ?? "?"} <b>${r[9]}</b></div>`).join("");
    $("card").innerHTML = `<h1>GAME OVER</h1><div>Team score <b>${score}</b> · best ${best}</div><div id="crews">${rank}</div>` + (watch ? "" : '<button id="start">Play again</button>');
  } else {
    let qr = "";
    if (code) { const q = qrcode(0, "M"); q.addData(`${baseUrl}/pad?room=${code}`); q.make(); qr = `<img alt="join QR" src="${q.createDataURL(6, 2)}">`; }
    $("card").innerHTML = `<h1>G-FORCE CREW</h1><div>Scan to join · you get a plane and a wingmate: fly close to link up for x2</div>${qr}` +
      `<div id="crews">${list || "<i>waiting for players...</i>"}</div>` +
      (watch ? "<div>Watching: the host starts the game</div>" : `<button id="start" ${players ? "" : "disabled"}>Start (${players} playing)</button><div id="more">Second screen? open ${baseUrl.replace(/^https?:\/\//, "")}/?watch=${code}</div>`);
  }
  if ($("start")) $("start").onclick = start;
}

function start() { unlock(); if (!watch && ws.readyState === 1) ws.send('{"t":"start"}'); }

function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`);
  ws.onopen = () => ws.send(JSON.stringify(watch ? { t: "watch", room: watch } : { t: "create", code }));
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "snap") {
      buf.push({ t: performance.now(), s: m }); if (buf.length > 12) buf.shift();
      if (m.sc !== score) { score = m.sc; $("score").textContent = score; }
      if (m.h !== hull || !$("hull").children.length) {
        hull = m.h;
        $("hull").innerHTML = Array.from({ length: HULL_MAX }, (_, i) => `<i class="pip${i < hull ? "" : " off"}"></i>`).join("");
      }
      if (m.s !== state) { state = m.s; drawCard(); }
      for (const ev of m.ev) {
        if (ev[0] === "f") sfx("fire");
        else if (ev[0] === "k") { burst(ev[1], ev[2], ev[3], 0xffb347); sfx("boom"); }
        else if (ev[0] === "h") { burst(ev[2], ev[3], 0, 0xff3030, 18); shake = flash = calm ? 0 : 1; sfx("hurt"); }
        else if (ev[0] === "w") {
          $("banner").textContent = `WAVE ${ev[1]} · ${{ scatter: "SCATTER", wall: "WALL: find the gap!", snake: "SNAKE", pincer: "PINCER" }[ev[2]]}`;
          $("banner").style.opacity = 1; clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { $("banner").style.opacity = 0; }, 2200);
        }
        else if (ev[0] === "o") { sfx("hurt"); if (score > best) { best = score; store("gfc.best", best); } }
      }
    } else if (m.t === "roster") { roster = m.players; drawCard(); }
    else if (m.t === "room") {
      code = m.code; if (!watch) sessionStorage.setItem("gfc.code", code); if (m.url) baseUrl = m.url;
      $("room").innerHTML = `join at ${baseUrl.replace(/^https?:\/\//, "")}/pad<b>${code}</b>`;
      drawCard();
    }
  };
  ws.onclose = () => setTimeout(connect, 1000);
}

addEventListener("keydown", (e) => {
  if (e.key === "Enter" && state !== "play") start();
  else if (e.key === "n" || e.key === "N") clock = ([0, 0.18, 0.5, 0.66].find((m) => m > (clock / CYCLE_S) % 1 + 0.01) ?? 1) * CYCLE_S;   // dawn, day, dusk, night
  else if (e.key === "c" || e.key === "C") { calm = !calm; shake = flash = 0; }
  else if (e.key === "m" || e.key === "M") { unlock(); audio.on = !audio.on; audio.master.gain.value = audio.on ? 1 : 0; }
});

/* ---------- sound: synthesized effects, plus public/music.mp3 if present ---------- */
const audio = { ctx: null, master: null, on: true, last: 0 };
function unlock() {
  if (audio.ctx) return;
  audio.ctx = new AudioContext(); audio.master = audio.ctx.createGain(); audio.master.connect(audio.ctx.destination);
  fetch("music.mp3").then((r) => r.ok ? r.arrayBuffer() : Promise.reject()).then((b) => audio.ctx.decodeAudioData(b)).then((buffer) => {
    const src = audio.ctx.createBufferSource(), g = audio.ctx.createGain(); g.gain.value = 0.5;
    src.buffer = buffer; src.loop = true; src.connect(g).connect(audio.master); src.start();
  }).catch(() => {});
}
function sfx(kind) {
  if (!audio.ctx || !audio.on) return;
  const now = audio.ctx.currentTime;
  if (kind === "fire") { if (now - audio.last < 0.07) return; audio.last = now; }
  const [type, f0, f1, dur, vol] = { fire: ["square", 880, 330, 0.07, 0.025], boom: ["sawtooth", 160, 40, 0.28, 0.07], hurt: ["sawtooth", 220, 50, 0.45, 0.1] }[kind];
  const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, now); o.frequency.exponentialRampToValueAtTime(f1, now + dur);
  g.gain.setValueAtTime(vol, now); g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g).connect(audio.master); o.start(now); o.stop(now + dur);
}

/* ---------- render loop ---------- */
const index = (rows) => new Map(rows.map((r) => [r[0], r]));
let last = performance.now(), groundOff = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;

  clock += dt;
  const day = (clock / CYCLE_S) % 1, A = KEYS[KEYS.findLastIndex((k) => k.t <= day)], B = KEYS[KEYS.indexOf(A) + 1];
  const f = (day - A.t) / (B.t - A.t), ease = f * f * (3 - 2 * f);
  scene.background.copy(A.sky).lerp(B.sky, ease);
  scene.fog.color.copy(scene.background);
  groundMat.color.copy(A.ground).lerp(B.ground, ease);
  sunLight.intensity = lerp(A.light, B.light, ease);
  sun.position.set(0, 125 * Math.sin(day * Math.PI * 2) - 8, -240);           // dead centre; below the ground = hidden
  moon.position.set(0, -125 * Math.sin(day * Math.PI * 2) - 8, -240);
  stars.material.opacity = clamp(1.9 - Math.abs(day - 0.79) * 8, 0, 1);
  groundOff = (groundOff + (state === "play" ? 20 + Math.min(score / 60, 40) : 14) * dt / 10) % 1;
  groundTex.offset.y = groundOff;

  if (buf.length) {
    const rt = now - DELAY;
    let a = buf[0], b = buf[0];
    for (let k = buf.length - 1; k >= 0; k--) if (buf[k].t <= rt) { a = buf[k]; b = buf[k + 1] || buf[k]; break; }
    const u = a === b ? 0 : clamp((rt - a.t) / (b.t - a.t), 0, 1);
    const pa = index(a.s.sh), ea = index(a.s.en), ba = index(a.s.bu), names = new Map(roster.map((p) => [p.id, p.name]));

    syncMeshes(planes, b.s.sh, (row) => {
      const color = COLORS[(row[1] - 1) % COLORS.length], mat = new THREE.MeshLambertMaterial({ color }), g = new THREE.Group();
      const part = (geo, x, y, z, m = mat) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); g.add(o); return o; };
      part(new THREE.BoxGeometry(0.9, 0.7, 4), 0, 0, 0);
      part(new THREE.BoxGeometry(4.8, 0.16, 1.3), 0, 0, 0.2);
      part(new THREE.BoxGeometry(1.8, 0.14, 0.7), 0, 0, 1.7);
      part(new THREE.BoxGeometry(0.14, 0.9, 0.8), 0, 0.5, 1.7);
      part(new THREE.ConeGeometry(0.45, 1.3, 8), 0, 0, -2.6).rotation.x = -Math.PI / 2;
      part(new THREE.SphereGeometry(0.18, 8, 8), -2.4, 0, 0.2, new THREE.MeshBasicMaterial({ color: 0xff3030 }));
      part(new THREE.SphereGeometry(0.18, 8, 8), 2.4, 0, 0.2, new THREE.MeshBasicMaterial({ color: 0x30ff60 }));
      const tag = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthTest: false, fog: false }));
      tag.scale.set(9, 1.7, 1); tag.position.y = 3.2; g.add(tag);
      g.userData = { tag, color, text: null };
      return g;
    }, (m, r) => {
      const o = pa.get(r[0]) || r;
      m.position.set(lerp(o[2], r[2], u), lerp(o[3], r[3], u), 0);
      m.rotation.z = -lerp(o[6], r[6], u) * 0.025; m.rotation.x = lerp(o[7], r[7], u) * 0.02;
      m.visible = r[8] ? !r[4] || Math.floor(now / 90) % 2 === 0 : Math.floor(now / 400) % 2 === 0;   // blink: fast = invulnerable, slow = phone dropped
      const text = names.get(r[0]) ?? "pilot";
      if (m.userData.text !== text) {
        m.userData.text = text;
        const c = document.createElement("canvas"); c.width = 512; c.height = 96;
        const g = c.getContext("2d"); g.font = "700 54px system-ui, sans-serif"; g.textAlign = "center";
        g.lineWidth = 8; g.strokeStyle = "#000b"; g.strokeText(text, 256, 66); g.fillStyle = hex(m.userData.color); g.fillText(text, 256, 66);
        const mat = m.userData.tag.material; mat.map?.dispose(); mat.map = new THREE.CanvasTexture(c); mat.needsUpdate = true;
      }
    });
    const pairs = new Map();                                                      // gold beam between linked wingmates
    for (const r of b.s.sh) if (r[5]) (pairs.get(r[1]) ?? pairs.set(r[1], [r[1]]).get(r[1])).push(planes.get(r[0]));
    syncMeshes(beams, [...pairs.values()].filter((v) => v.length === 3), () => new THREE.Mesh(beamGeo, beamMat), (m, v) => {
      const [, A, B] = v, dx = B.position.x - A.position.x, dy = B.position.y - A.position.y;
      m.position.set((A.position.x + B.position.x) / 2, (A.position.y + B.position.y) / 2, 0);
      m.scale.x = Math.hypot(dx, dy); m.rotation.z = Math.atan2(dy, dx);
    });
    syncMeshes(enemies, b.s.en, () => new THREE.Mesh(enemyGeo, enemyMat), (m, r) => {
      const o = ea.get(r[0]) || r;
      m.position.set(lerp(o[1], r[1], u), lerp(o[2], r[2], u), lerp(o[3], r[3], u));
      m.rotation.x += dt * 2; m.rotation.y += dt * 1.3;
    });
    syncMeshes(bullets, b.s.bu, () => new THREE.Mesh(bulletGeo, bulletMat), (m, r) => {
      const o = ba.get(r[0]) || r;
      m.position.set(lerp(o[1], r[1], u), lerp(o[2], r[2], u), lerp(o[3], r[3], u));
    });
  }

  for (let k = sparks.length - 1; k >= 0; k--) {
    const s = sparks[k]; s.life -= dt;
    s.m.position.addScaledVector(s.v, dt); s.m.material.opacity = clamp(s.life / 0.7, 0, 1);
    if (s.life <= 0) { scene.remove(s.m); s.m.material.dispose(); sparks.splice(k, 1); }
  }
  shake = Math.max(0, shake - dt * 2.2); flash = Math.max(0, flash - dt * 3);
  camera.position.set((Math.random() - 0.5) * shake * 1.2, 10 + (Math.random() - 0.5) * shake * 1.2, camZ);
  camera.lookAt(0, 8, -40);
  $("flash").style.boxShadow = flash > 0 ? `inset 0 0 160px rgba(255,40,40,${flash * 0.7})` : "none";
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

connect();
requestAnimationFrame(frame);
</script>
